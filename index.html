<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แปลงค่าเงิน | Currency Converter</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="แปลงค่าเงินระหว่างประเทศ ใช้งานได้แม้ออฟไลน์" />
  <link rel="preconnect" href="https://open.er-api.com" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" role="main">
    <header class="app__header">
      <h1 class="app__title">💱 แปลงค่าเงิน</h1>
      <p class="app__subtitle">Currency Converter · by PeppaBoat + ใช้งานออฟไลน์ได้</p>
    </header>

    <section class="card" aria-label="แบบฟอร์มแปลงค่าเงิน">
      <div class="field">
        <label class="field__label" for="amount">จำนวนเงิน</label>
        <input
          class="field__input"
          id="amount"
          type="text"
          inputmode="decimal"
          value="1"
          autocomplete="off"
        />
      </div>

      <div class="currencies">
        <div class="field">
          <label class="field__label" for="from">จาก (ต้นทาง)</label>
          <select class="field__select" id="from" aria-label="สกุลเงินต้นทาง"></select>
        </div>

        <button class="swap" id="swap" type="button" title="สลับสกุลเงิน" aria-label="สลับสกุลเงินต้นทางและปลายทาง">
          ⇅
        </button>

        <div class="field">
          <label class="field__label" for="to">เป็น (ปลายทาง)</label>
          <select class="field__select" id="to" aria-label="สกุลเงินปลายทาง"></select>
        </div>
      </div>

      <div class="result" id="result" aria-live="polite">
        <div class="result__main" id="resultMain">—</div>
        <div class="result__rate" id="resultRate"></div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite">กำลังโหลดอัตราแลกเปลี่ยน…</p>

      <button class="refresh" id="refresh" type="button">
        <span class="refresh__icon" aria-hidden="true">↻</span>
        <span class="refresh__label">อัปเดตอัตราตอนนี้</span>
      </button>
    </section>

    <footer class="app__footer">
      <span id="updated"></span>
      <span>ใช้งานออฟไลน์ได้ · ข้อมูลจาก open.er-api.com</span>
    </footer>
  </main>

  <!-- fallback-rates.js ต้องโหลดก่อน app.js เพื่อให้มีอัตราสำรองพร้อมใช้แบบ offline -->
  <script src="fallback-rates.js"></script>
  <script src="app.js"></script>
</body>
</html>
